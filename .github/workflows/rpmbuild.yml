name: "rpmbuild"
concurrency:
  group: ${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}
  cancel-in-progress: true
on:
  push:
    branches:
    - main
    paths:
    - rpm/**
    - .github/workflows/rpmbuild.yml

  pull_request:
    types: [opened, synchronize, reopened]
    paths:
    - rpm/**
    - .github/workflows/rpmbuild.yml

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        centos:
        - 'ubi'
    steps:
    - name: "Checkout source code at current commit"
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Prepare tags for Docker image
      id: prepare
      env:
        BUILDER: rpmbuild
        MATRIX_TAG: ${{matrix.centos}}
      run: |
        DOCKER_IMAGE=ghcr.io/${{ github.repository }}-${BUILDER}
        TAGS="${DOCKER_IMAGE}:${MATRIX_TAG},${DOCKER_IMAGE}:latest"
        COMMIT_SHA="${GITHUB_SHA}"
        if [[ $GITHUB_REF == refs/tags/* ]]; then
          VERSION=${GITHUB_REF#refs/tags/}
        elif [[ $GITHUB_REF == refs/pull/* ]]; then
          VERSION=pr-${{ github.event.pull_request.number }}
          COMMIT_SHA=${{ github.event.pull_request.head.sha }}
        fi
        TAGS="$TAGS,${DOCKER_IMAGE}:sha-${COMMIT_SHA:0:7}"
        if [[ -n $VERSION ]]; then
          TAGS="$TAGS,${DOCKER_IMAGE}:${VERSION}"
        fi
        echo "tags=${TAGS}" >> $GITHUB_OUTPUT
    - name: Set up QEMU
      uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
    - name: Login to DockerHub
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ghcr.io
        username: "${{ github.actor }}"
        password: "${{ secrets.GITHUB_TOKEN }}"
    - name: "Build and push RPM builder docker image to DockerHub"
      id: docker_build_builder
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
      with:
        push: true
        platforms: linux/amd64,linux/arm64
        provenance: false
        tags: ${{ steps.prepare.outputs.tags }}
        file: rpm/Dockerfile.${{matrix.centos}}
